quarkus.datasource.db-kind=mysql
quarkus.datasource.username=pcelinjak
quarkus.datasource.password=${MYSQL_PASSWORD:change-me-app}
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/pcelinjak?useSSL=false&allowPublicKeyRetrieval=true

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

pcelinjak.jwt.secret=${PCELINJAK_JWT_SECRET:change-me-jwt-secret-min-32-chars-long}
pcelinjak.jwt.expiration-seconds=31536000

# Email (aktivacija naloga) – isto SMTP kao Farma
quarkus.mailer.from=${MAIL_FROM:noreply@hexatech.rs}
quarkus.mailer.host=${MAIL_HOST:mailcluster.loopia.se}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.username=${MAIL_USERNAME:noreply@hexatech.rs}
quarkus.mailer.password=${MAIL_PASSWORD:}
quarkus.mailer.auth-methods=LOGIN
quarkus.mailer.ssl=false
quarkus.mailer.start-tls=REQUIRED
pcelinjak.mail.base-url=${PCELINJAK_MAIL_BASE_URL:http://192.168.8.175:8081}

# Shared notification-service
notification.service.url=${NOTIFICATION_SERVICE_URL:http://host.docker.internal:8085}
notification.api-key=${NOTIFICATION_API_KEY:}
notification.enabled=${NOTIFICATION_ENABLED:true}

quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-device-id
quarkus.http.cors.exposed-headers=x-device-mismatch

quarkus.http.host=0.0.0.0
quarkus.http.port=8080

quarkus.log.file.enable=true
quarkus.log.file.path=/app/logs/backend.log
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.rotation.rotate-on-boot=true

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.http.port=0
%test.quarkus.http.test-port=0
%test.pcelinjak.jwt.expiration-seconds=86400
%test.quarkus.mailer.mock=true
%test.pcelinjak.mail.base-url=http://localhost:8080
%test.notification.enabled=false

%dev.quarkus.log.file.enable=false
%dev.quarkus.hibernate-orm.log.sql=true
