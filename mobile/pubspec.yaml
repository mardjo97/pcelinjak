name: pcelinjak_mobile
description: Evidencija pčelinjaka – offline-first Flutter klijent
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  http: ^1.4.0
  uuid: ^4.5.1
  mobile_scanner: ^7.0.1
  share_plus: ^11.0.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_local_notifications: ^19.3.0
  timezone: ^0.10.1
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.6
  archive: ^4.0.9
  flutter_native_splash: ^2.4.6
  connectivity_plus: ^7.3.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#F7F3E8"
  adaptive_icon_foreground: assets/branding/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F7F3E8"
  image: assets/branding/splash_logo_transparent.png
  android_12:
    color: "#F7F3E8"
    image: assets/branding/splash_logo_transparent.png
    icon_background_color: "#F7F3E8"
  android: true
  ios: true
  web: false
